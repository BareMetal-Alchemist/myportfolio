<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 · brew not found · Noah Scott</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --paper: #fbf8f3;
        --cream: #f4ece1;
        --foam: #eadfcf;
        --trace: #d9cbb6;
        --copper: #b0703f;
        --copper-ink: #8f5730;
        --roast: #6b4a38;
        --espresso: #2b1f19;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --paper: #1c1410;
          --cream: #241a15;
          --foam: #33271f;
          --trace: #43342b;
          --copper: #d08a55;
          --copper-ink: #e0a26f;
          --roast: #c9b8a8;
          --espresso: #f4ece1;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --paper: #1c1410;
        --cream: #241a15;
        --foam: #33271f;
        --trace: #43342b;
        --copper: #d08a55;
        --copper-ink: #e0a26f;
        --roast: #c9b8a8;
        --espresso: #f4ece1;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--paper);
        color: var(--espresso);
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 560px;
        padding: 40px 32px 36px;
        background: var(--cream);
        border: 1px solid var(--foam);
        border-radius: 14px;
        text-align: center;
        overflow: hidden;
      }
      .trace {
        position: absolute; top: 0; right: 0; width: 120px; height: 120px;
        stroke: var(--trace); stroke-width: 1.5; fill: none; stroke-linecap: round;
      }
      .trace circle { fill: var(--paper); }
      .eyebrow {
        margin: 0 0 12px;
        color: var(--copper-ink);
        font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 0.8rem;
      }
      h1 {
        margin: 0 0 8px;
        font-family: "Fraunces", "Iowan Old Style", Georgia, serif;
        font-weight: 450;
        font-size: clamp(2rem, 6vw, 2.75rem);
        line-height: 1.1;
      }
      p { margin: 0 0 1em; color: var(--roast); }
      code {
        font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
        color: var(--espresso);
        background: var(--paper);
        border: 1px solid var(--foam);
        border-radius: 6px;
        padding: 2px 8px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        margin-top: 8px;
        border-radius: 999px;
        background: var(--espresso);
        color: var(--paper);
        text-decoration: none;
        font-weight: 500;
      }
      a.btn:hover { background: var(--copper-ink); color: #fff; }
      a.btn:focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
      .cup { margin: 0 auto 20px; width: 120px; height: 120px; }
    </style>
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <main class="card">
      <svg class="trace" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M120 24H70l-14 14H20" /><path d="M96 120V70L82 56V20" />
        <circle cx="20" cy="38" r="3.5" /><circle cx="82" cy="20" r="3.5" />
      </svg>
      <svg class="cup" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="64" r="50" fill="var(--paper)" />
        <path d="M30 44h52v26a18 18 0 0 1-18 18H48a18 18 0 0 1-18-18z" fill="var(--paper)" stroke="var(--espresso)" stroke-width="3" stroke-linejoin="round" />
        <path d="M82 50h6a9 9 0 0 1 0 18h-6" fill="none" stroke="var(--espresso)" stroke-width="3" />
        <path d="M40 100h32M38 100v-5M46 100v-5M54 100v-5M62 100v-5M70 100v-5" stroke="var(--espresso)" stroke-width="2.6" stroke-linecap="round" />
        <text x="44" y="70" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="var(--copper-ink)">&amp;mut</text>
      </svg>
      <p class="eyebrow">404: brew not found</p>
      <h1>This cup is empty.</h1>
      <p>There's nothing at <code id="path">this address</code>. The grinder's still warm, though.</p>
      <a class="btn" href="/">Back to the counter</a>
    </main>
    <script>
      try {
        var p = window.location.pathname;
        if (p && p !== "/") document.getElementById("path").textContent = p;
      } catch (e) {}
    </script>
  </body>
</html>
